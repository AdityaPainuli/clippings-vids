
name: checks

on:
  push:
  pull_request:

jobs:
  detection:
    name: Backend Detection Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-bolcap.txt
            backend/constraints-bolcap.txt

      # Install runtime dependencies required by the captions package.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bolcap.txt -c constraints-bolcap.txt

      # Verify filler detection does not remove real words.
      - name: Filler detection cuts no real words
        run: python scripts/eval_tighten.py

      # Verify timeline timecode calculations.
      - name: Timeline timecode arithmetic
        run: python scripts/check_timeline.py

      # Test retake detection using a stubbed model.
      - name: Retake detection
        run: python scripts/eval_retakes.py

      # Verify fit-to-length functionality.
      - name: Fit to length
        run: python scripts/check_fit.py

      # Run unit tests when test modules are available.
      - name: Unit tests
        run: |
          if find tests -maxdepth 1 -type f -name "test_*.py" -print -quit | grep -q .; then
            python -m unittest discover -s tests -p "test_*.py" -v
          else
            echo "No test modules under backend/tests, nothing to run."
          fi
