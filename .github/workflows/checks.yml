name: checks

on:
  push:
  pull_request:

jobs:
  detection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-bolcap.txt

      # The checks import `captions`, whose package __init__ pulls in the
      # style schema and the transcriber, so the runtime deps have to be here
      # even though the checks themselves need no model, no ffmpeg, and no
      # network.
      - name: Install deps
        run: pip install -r requirements-bolcap.txt

      - name: Filler detection cuts no real words
        run: python scripts/eval_tighten.py

      - name: Timeline timecode arithmetic
        run: python scripts/check_timeline.py

      # Stage 1 recall plus the rules that keep a bad model reply from
      # becoming an edit. The model itself is stubbed — no key, no network.
      - name: Retake detection
        run: python scripts/eval_retakes.py

      - name: Fit to length
        run: python scripts/check_fit.py

      - name: CLI argument validation
        run: python scripts/check_cli.py
      # Contributor unit tests. The suites stub the heavy imports (yt_dlp,
      # whisper, moviepy) themselves, so this needs no dep beyond the runtime
      # ones already installed above, and no pytest. The guard keeps the job
      # green on a tree that has fixtures but no test modules yet; it goes
      # live on its own the first time one lands.
      - name: Unit tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s tests -p "test_*.py" -v
          else
            echo "No test modules under backend/tests, nothing to run."
          fi
