
name: Bolcap Release

on:
  push:
    tags:
      - "bolcap-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64

          - os: macos-latest
            target: macos-arm64

          - os: macos-15-intel
            target: macos-x64

          - os: ubuntu-latest
            target: linux-x64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bolcap.txt -c constraints-bolcap.txt pyinstaller

      - name: Build application
        run: pyinstaller bolcap.spec --noconfirm

      - name: Smoke test
        shell: bash
        run: |
          bash scripts/smoke_bolcap.sh ./dist/bolcap/bolcap

      - name: Package application
        shell: bash
        run: |
          cd dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "bolcap-${{ matrix.target }}.zip" bolcap
          else
            zip -qr "bolcap-${{ matrix.target }}.zip" bolcap
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolcap-${{ matrix.target }}
          path: backend/dist/bolcap-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/bolcap-v')

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/bolcap-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
