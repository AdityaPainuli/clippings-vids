name: bolcap-release

on:
  push:
    tags: ["bolcap-v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest        # arm64
            target: macos-arm64
          - os: macos-13            # last intel runner
            target: macos-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bolcap.txt pyinstaller

      - name: Build
        run: pyinstaller bolcap.spec --noconfirm

      - name: Smoke test (full pipeline)
        shell: bash
        # Runs first-run setup through the app's own downloader (tiny model),
        # transcribes a generated fixture, and validates a burned render —
        # missing ffprobe, codecs, model data, or fonts all fail here.
        run: bash scripts/smoke_bolcap.sh ./dist/bolcap/bolcap

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "bolcap-${{ matrix.target }}.zip" bolcap
          else
            zip -qr "bolcap-${{ matrix.target }}.zip" bolcap
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bolcap-${{ matrix.target }}
          path: backend/dist/bolcap-${{ matrix.target }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "bolcap-*.zip"
          generate_release_notes: true
